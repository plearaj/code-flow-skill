<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Flow — Quality Report</title>
<style>
/* ============ theme tokens (shared vocabulary with the flow viewer) ============ */
:root{
  color-scheme:dark;
  /* Nocturne, inlined: the report is a single self-contained file, so the
     design system's tokens are carried here rather than linked. */
  --bg:#161826; --bg-2:#1b1d2c; --panel:#232532; --raise:#2b2d3b; --code:#14161f;
  --border:#3f424d; --border-strong:#595d6c;
  --text:#e9e9ed; --dim:#9397ab; --faint:#75798c;
  --accent:#9184d9; --accent-dim:#5d5294; --err:#d98a95;
  /* one accent, so severity is coded by lightness AND by fill, never hue alone */
  --high:#b5abfc; --medium:#796cbf; --low:#595d6c;
  --shadow:0 0 0 1px #3f424d, 0 6px 18px rgba(0,0,0,.5);
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f5fe; --bg-2:#e9ebf6; --panel:#fbfbff; --raise:#eceffb; --code:#eef0fa;
  --border:#cfd3e5; --border-strong:#b2b6ca;
  --text:#292b31; --dim:#595d6c; --faint:#75798c;
  --accent:#5d5294; --accent-dim:#b5abfc; --err:#8d3f4a;
  --high:#423a6a; --medium:#796cbf; --low:#75798c;
  --shadow:0 0 0 1px #cfd3e5, 0 6px 18px rgba(41,43,49,.08);
}
__THEME_CSS__
/* ============ page frame ============ */
*{box-sizing:border-box; margin:0}
[hidden]{display:none !important}
body{background:
    radial-gradient(120% 60% at 50% 0%, var(--bg-2) 0%, transparent 60%),
    var(--bg);
  background-attachment:fixed; color:var(--text);
  font:14px/1.65 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace}
#app{max-width:880px; margin:0 auto; padding:0 28px 96px}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
a{color:var(--accent)} a:hover{color:var(--text)}
/* ============ error card ============ */
#err{max-width:880px; margin:28px auto; padding:0 28px}
#err>div{border:1px solid var(--border); border-top:2px solid var(--err); border-radius:12px;
  background:var(--panel); box-shadow:var(--shadow); padding:20px 22px}
#err h2{color:var(--err); font-size:12px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:10px}
#err pre{white-space:pre-wrap; word-break:break-word; font-size:12.5px; line-height:1.7;
  font-family:ui-monospace,"Cascadia Code",Menlo,Consolas,monospace}
/* ============ header ============ */
.topbar{display:flex; align-items:flex-start; gap:14px; padding:34px 0 20px; border-bottom:1px solid var(--border)}
.topbar h1{font-size:22px; line-height:1.2; letter-spacing:-.02em; font-weight:500}
.topbar .sub{margin-top:8px; font-size:11.5px; line-height:1.8; color:var(--faint); word-break:break-word;
  font-family:ui-monospace,Menlo,Consolas,monospace}
.topbar .spacer{flex:1}
button.ghost{height:32px; min-width:32px; padding:0 12px; border:1px solid var(--border); border-radius:9px;
  background:var(--bg-2); color:var(--dim); font:12px/1 "Inter",system-ui,sans-serif; cursor:pointer; flex:none;
  transition:border-color .14s,color .14s}
button.ghost:hover,a.ghost:hover{border-color:var(--border-strong); color:var(--text)}
a.ghost{display:inline-flex; align-items:center; height:32px; padding:0 12px; border:1px solid var(--border);
  border-radius:9px; background:var(--bg-2); color:var(--dim); font-size:12px; text-decoration:none; flex:none;
  transition:border-color .14s,color .14s}
/* ============ coverage banner: leads the page, never collapsible ============ */
.coverage-banner{margin-top:26px; border:1px solid var(--border); border-radius:14px;
  background:linear-gradient(180deg, var(--raise), var(--panel)); box-shadow:var(--shadow);
  padding:20px 22px; position:relative; overflow:hidden}
.coverage-banner::before{content:""; position:absolute; inset:0 0 auto 0; height:2px;
  background:linear-gradient(90deg, var(--accent), transparent 70%)}
.coverage-banner h2{font-size:10px; letter-spacing:.18em; text-transform:uppercase; font-weight:700; color:var(--accent)}
.coverage-banner .lead{margin-top:11px; font-size:15px; line-height:1.6; text-wrap:pretty}
.coverage-banner .lead.partial{font-weight:600}
.coverage-banner ul.facts{list-style:none; margin-top:16px; display:grid; gap:0}
.coverage-banner ul.facts li{font-size:13px; line-height:1.5; padding:8px 0 8px 22px; position:relative;
  border-top:1px solid var(--border)}
.coverage-banner ul.facts li:first-child{border-top:0}
.coverage-banner ul.facts li::before{content:""; position:absolute; left:4px; top:15px;
  width:6px; height:6px; border-radius:50%; background:var(--faint)}
.coverage-banner ul.facts li.warn{color:var(--err)}
.coverage-banner ul.facts li.warn::before{background:var(--err)}
.coverage-banner .note{margin-top:14px; padding-top:13px; border-top:1px solid var(--border);
  font-size:12px; line-height:1.7; color:var(--faint); text-wrap:pretty}
/* ============ the no-findings screen ============ */
.no-findings{margin-top:26px; border:1px solid var(--accent-dim); border-radius:14px;
  background:var(--panel); box-shadow:var(--shadow); padding:22px 24px}
.no-findings h2{font-size:17px; line-height:1.35; font-weight:500; letter-spacing:-.01em}
.no-findings p{margin-top:11px; font-size:13.5px; line-height:1.7; color:var(--dim); text-wrap:pretty}
/* ============ filters ============ */
.filters{display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin-top:38px;
  position:sticky; top:0; z-index:5; padding:12px 14px; border:1px solid var(--border); border-radius:12px;
  background:color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter:blur(8px); box-shadow:var(--shadow)}
.filters .filter{display:flex; align-items:center; gap:7px; font-size:11px; color:var(--faint);
  letter-spacing:.08em; text-transform:uppercase}
.filters select{height:28px; padding:0 8px; border:1px solid var(--border); border-radius:8px;
  background:var(--bg-2); color:var(--text); font:12px "Inter",system-ui,sans-serif; cursor:pointer;
  letter-spacing:0; text-transform:none}
.filters select:hover{border-color:var(--border-strong)}
.filters .count{margin-left:auto; font-size:11.5px; color:var(--dim); font-variant-numeric:tabular-nums;
  font-family:ui-monospace,Menlo,monospace}
.hint{margin-top:12px; font-size:11.5px; line-height:1.7; color:var(--faint); text-wrap:pretty}
.filter-empty{margin-top:18px; border:1px dashed var(--border-strong); border-radius:12px;
  padding:16px 18px; font-size:13px; line-height:1.65; color:var(--dim)}
/* ============ findings list ============ */
/* minmax(0,1fr), not the default: grid items keep min-width:auto, so a single
   column would be sized to the WIDEST item's min-content width — one long
   snippet line anywhere in the report would then set the width of every card
   and push the document into horizontal overflow. */
.findings-list{margin-top:18px; display:grid; grid-template-columns:minmax(0,1fr); gap:18px}
.finding{border:1px solid var(--border); border-radius:14px; background:var(--panel);
  box-shadow:var(--shadow); padding:18px 20px 20px; position:relative; overflow:hidden;
  transition:border-color .16s}
.finding::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--low)}
.finding:hover{border-color:var(--border-strong)}
.finding.sev-high::before{background:var(--high)}
.finding.sev-medium::before{background:var(--medium)}
.finding.sev-low::before{background:var(--low)}
.fhead{display:flex; align-items:center; flex-wrap:wrap; gap:7px}
.fid{font-size:11.5px; font-weight:650; letter-spacing:.04em; color:var(--dim); margin-right:2px}
.chip{font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; line-height:1.6;
  color:var(--dim); border:1px solid var(--border); border-radius:6px; padding:2px 8px; background:var(--bg-2)}
/* severity is coded by fill, not hue alone: high is solid, medium is outlined in
   its own color, low stays neutral — and every chip names its level in words */
.chip.sev-high{background:var(--high); border-color:var(--high); color:#161826; font-weight:700}
.chip.sev-medium{color:var(--medium); border-color:var(--medium); background:transparent}
.chip.sev-low{color:var(--dim); border-color:var(--border-strong); background:transparent}
/* dashed border: an unconfirmed finding stays visibly provisional in any palette */
.chip.conf-unverified{color:var(--err); border:1px dashed var(--err); background:transparent}
.finding h3{margin-top:13px; font-size:16.5px; line-height:1.35; font-weight:500; letter-spacing:-.015em; text-wrap:pretty}
.finding p{margin-top:9px; font-size:13.5px; line-height:1.7; color:var(--dim); text-wrap:pretty}
.candidate-note{margin-top:11px; border-left:2px solid var(--accent-dim); padding:3px 0 3px 13px;
  color:var(--dim); font-size:12.5px; line-height:1.65}
dl.evidence{margin-top:14px; display:grid; grid-template-columns:auto 1fr; gap:0 16px; font-size:12.5px;
  border:1px solid var(--border); border-radius:10px; padding:10px 12px; background:var(--bg-2)}
dl.evidence dt{color:var(--faint); text-transform:uppercase; font-size:9.5px; font-weight:700; letter-spacing:.1em; padding:4px 0}
dl.evidence dd{line-height:1.5; padding:4px 0; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px}
.finding h4{margin-top:18px; font-size:10px; letter-spacing:.14em; text-transform:uppercase; font-weight:700;
  color:var(--faint); display:flex; align-items:center; gap:9px}
.finding h4::after{content:""; flex:1; height:1px; background:var(--border)}
ul.sites{list-style:none; margin-top:10px; display:grid; grid-template-columns:minmax(0,1fr); gap:10px}
ul.sites li{border:1px solid var(--border); border-radius:11px; background:var(--bg-2); padding:10px 13px 12px}
ul.sites .loc{font-size:12.5px; font-weight:650; word-break:break-all; color:var(--text)}
ul.sites .sym{font-size:11.5px; color:var(--faint); margin-top:2px}
ul.sites pre{margin-top:9px; background:var(--code); border:1px solid var(--border); border-radius:9px;
  padding:11px 13px; font-size:12.5px; line-height:1.65; overflow-x:auto; white-space:pre; tab-size:4;
  font-family:ui-monospace,"Cascadia Code",Menlo,Consolas,monospace}
ul.sites .nosnip{margin-top:7px; font-size:11.5px; color:var(--faint); font-style:italic}
.suggestion{margin-top:16px; padding:13px 14px; border:1px solid var(--border); border-radius:11px;
  background:var(--bg-2); font-size:13.5px; line-height:1.65}
.suggestion .lbl{display:block; font-size:9.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--accent); margin-bottom:5px}
@media (max-width:600px){ .filters .count{margin-left:0; width:100%} }
</style>
</head>
<body>
<div id="err" hidden></div>
<main id="app"></main>

<!-- Report data. The token below is replaced verbatim with a JSON object matching
     the quality-report schema. IMPORTANT for whoever fills this in: any literal
     "</" inside snippet strings must be written as "<\/" (e.g. "<\/div>"),
     otherwise a "</script>" sequence inside the JSON would terminate this script
     block. Everything downstream of the parse renders with textContent, so a
     snippet that survives the parse can never be interpreted as markup. -->
<script type="application/json" id="report-data">__REPORT_DATA__</script>
<script>
(function(){
"use strict";
/* built dynamically so the installer's string replacement cannot touch the check itself */
var TOKEN = "__REPORT" + "_DATA__";
var errBox = document.getElementById("err");
function fail(title, lines){
  errBox.hidden = false;
  errBox.innerHTML = "";
  var card = document.createElement("div");
  var h = document.createElement("h2"); h.textContent = title; card.appendChild(h);
  var pre = document.createElement("pre"); pre.textContent = lines.join("\n"); card.appendChild(pre);
  errBox.appendChild(card);
}

/* ==== validate:start ==== */
function validate(raw, TOKEN){
  raw = (raw || "").trim();
  if (raw === TOKEN){
    return { ok:false, title:"No report data", lines:[
      "The " + TOKEN + " placeholder was never replaced.",
      "This template must be filled with a JSON data block before viewing."
    ]};
  }
  var data;
  try { data = JSON.parse(raw); }
  catch(e){
    return { ok:false, title:"Invalid JSON in #report-data", lines:[
      String(e.message || e), "",
      "Tip: literal </ inside snippet strings must be escaped as <\\/."
    ]};
  }
  var SEVERITY = { high:1, medium:1, low:1 };
  var PRINCIPLE = { DRY:1, KISS:1, YAGNI:1, SOLID:1, DEPTH:1, RULES:1 };
  var CONFIDENCE = { unverified:1, verified:1 };
  var DETECTOR = { "duplicate-intent":1, "repeated-sequence":1, "complexity-hotspot":1,
                   "unreached":1, "rule-violation":1, "single-responsibility":1,
                   "interface-segregation":1, "dependency-cycle":1, "shallow-module":1,
                   "pass-through":1, "internals-coupled-test":1, "open-closed":1,
                   "liskov-substitution":1 };
  var problems = [];
  if (!data || typeof data !== "object" || Array.isArray(data)){
    return { ok:false, title:"Report data failed validation", lines:["The document must be a JSON object."] };
  }
  if (data.schema !== 1) problems.push("`schema` must be 1, got " + JSON.stringify(data.schema) + ".");
  var meta = (data.meta && typeof data.meta === "object") ? data.meta : null;
  if (!meta) problems.push("`meta` must be an object.");
  var coverage = (data.coverage && typeof data.coverage === "object") ? data.coverage : null;
  if (!coverage) problems.push("`coverage` must be an object.");
  var findings = Array.isArray(data.findings) ? data.findings : null;
  if (!findings) problems.push("`findings` must be an array.");
  var seen = {};
  (findings || []).forEach(function(f, i){
    if (!f || typeof f !== "object"){ problems.push("findings[" + i + "] is not an object."); return; }
    var id = typeof f.id === "string" && f.id ? f.id : null;
    if (!id){ problems.push("findings[" + i + "] is missing a string `id`."); return; }
    if (Object.prototype.hasOwnProperty.call(seen, id)) problems.push("duplicate finding id \"" + id + "\".");
    seen[id] = 1;
    if (!SEVERITY[f.severity]) problems.push(id + " has severity " + JSON.stringify(f.severity) + "; want high, medium or low.");
    if (!PRINCIPLE[f.principle]) problems.push(id + " has principle " + JSON.stringify(f.principle) + "; want DRY, KISS, YAGNI, SOLID, DEPTH or RULES.");
    if (!DETECTOR[f.detector]) problems.push(id + " has detector " + JSON.stringify(f.detector) + ".");
    if (!CONFIDENCE[f.confidence]) problems.push(id + " has confidence " + JSON.stringify(f.confidence) + "; want unverified or verified.");
    if (!Array.isArray(f.sites) || !f.sites.length){
      problems.push(id + " must cite at least one site; a finding without file:line evidence is not reportable.");
      return;
    }
    f.sites.forEach(function(s, j){
      if (!s || typeof s !== "object"){ problems.push(id + " site " + j + " is not an object."); return; }
      if (typeof s.file !== "string" || !s.file) problems.push(id + " site " + j + " is missing `file`.");
      else if (s.file.indexOf("\\") !== -1) problems.push(id + " site " + j + " uses backslashes; paths are forward-slash and repo-relative.");
      if (typeof s.line !== "number" || s.line < 1) problems.push(id + " site " + j + " is missing a positive `line`.");
    });
  });
  if (problems.length) return { ok:false, title:"Report data failed validation", lines:problems };
  return { ok:true, data:data, meta:meta, coverage:coverage, findings:findings };
}
/* ==== validate:end ==== */
/* Nothing below this line is covered by any test in this repository: the
   suite pins that validate()'s verdict is called through fail()/return, but
   what fail() writes to the DOM and everything the render code below builds
   is exercised only by the pre-release manual browser pass (see the "Before
   publishing" section of README.md). A change to this file's rendering
   re-opens that gap silently -- run the manual pass again. */

var raw = document.getElementById("report-data").textContent;
var v = validate(raw, TOKEN);
if (!v.ok) { fail(v.title, v.lines); return; }

/* ============ render ============
   Every value below reaches the page through textContent. Snippets are source
   code from the analyzed repository: they routinely contain angle brackets and
   must always land on the page as characters, never as markup. */
var meta = v.meta, coverage = v.coverage, findings = v.findings;
var app = document.getElementById("app");

function el(tag, cls, text, parent){
  var d = document.createElement(tag);
  if (cls) d.className = cls;
  if (text != null) d.textContent = text;
  (parent || app).appendChild(d);
  return d;
}
function count(x){ return (typeof x === "number" && isFinite(x)) ? x : null; }
function plural(n, one, many){ return n === 1 ? one : many; }

/* ---- header ---- */
var topbar = el("header", "topbar");
var titles = el("div", "titles", null, topbar);
el("h1", null, "Code Flow — Quality Report", titles);
var sub = [];
if (meta.generated) sub.push("generated " + meta.generated);
if (meta.mapGenerated) sub.push("from a map of " + meta.mapGenerated);
if (meta.mapMode) sub.push(String(meta.mapMode));
if (meta.mapDetail) sub.push("detail: " + meta.mapDetail);
sub.push(meta.readCode ? "findings verified against source" : "findings not verified against source");
el("div", "sub", sub.join("  ·  "), titles);
el("div", "spacer", null, topbar);
var up = el("a", "ghost up", "Flows", topbar);
up.href = "index.html";
up.title = "All mapped flows";
var themeBtn = el("button", "ghost", "◐", topbar);
themeBtn.title = "Toggle light/dark";
themeBtn.setAttribute("aria-label", "Toggle light and dark theme");

/* ---- coverage banner: leads the page, structurally and visually, and is not
   collapsible. Everything below it is only as trustworthy as these numbers. ---- */
var traced = count(coverage.flowsTraced), entries = count(coverage.entryPointsFound);
var partial = traced !== null && entries !== null && traced < entries;
var banner = el("section", "coverage-banner");
el("h2", null, "Coverage", banner);
var lead = el("p", partial ? "lead partial" : "lead", null, banner);
if (partial){
  lead.textContent = "The map is partial: " + traced + " of " + entries +
    " entry points were traced. Everything below is clean within what was mapped — " +
    "never a clean bill of health for the repository.";
} else if (traced !== null && entries !== null){
  lead.textContent = traced + " of " + entries + " entry " + plural(entries, "point", "points") +
    " found were traced. Findings describe what the map catalogued, not what the repository contains.";
} else {
  lead.textContent = "This report does not record how many entry points were traced, " +
    "so how much of the repository it covers is unknown.";
}

var facts = el("ul", "facts", null, banner);
function fact(text, warn){ return el("li", warn ? "warn" : null, text, facts); }

if (count(coverage.functionsCatalogued) !== null){
  fact(coverage.functionsCatalogued + " functions catalogued");
}
if (count(coverage.filesChanged) !== null){
  fact(coverage.filesChanged + " of the files the map recorded " +
    plural(coverage.filesChanged, "has", "have") + " changed since mapping",
    coverage.filesChanged > 0);
}
if (count(coverage.findingsDropped) !== null){
  fact(coverage.findingsDropped + " " + plural(coverage.findingsDropped, "finding", "findings") +
    " dropped as stale", coverage.findingsDropped > 0);
}
if (count(coverage.flowsUnreadable)){
  fact(coverage.flowsUnreadable + " " + plural(coverage.flowsUnreadable, "flow", "flows") +
    " could not be read and " + plural(coverage.flowsUnreadable, "was", "were") + " not analyzed", true);
}

/* A skipped detector is a hole in the report, so it is shown with its reason
   rather than hidden. `detectorsSkipped` carries names only, so the reason is
   restated here from the rule in the quality command that gates the detector
   off. A name this viewer does not recognise still gets a line — an unnamed
   hole is worse than an unexplained one. */

/* The five call-graph detectors share one cause and one remedy: a map built
   without a tracer carries no `calls`, so there is no module graph to walk, and
   a graph guessed from file names would be exactly the evidence the quality
   command refuses to invent. */
var NO_GRAPH = "the map carries no `calls`, so there was no module graph to walk — re-map with " +
  "/code-flow.map --whole-code-base --tracer on";
var NO_SOURCE = "this detector reads source, not the map, and --read-code was not passed — " +
  "re-run the quality command with --read-code to check it";
/* The three detectors defined over flow nodes rather than over the inventory.
   A map built from a tracer's output with no tracing pass has an empty flow
   registry, which is ordinary rather than broken -- and `unreached` there
   would call the whole catalog dead code. */
var NO_FLOWS = "the map registers no traced flows, so there were no flow nodes to read \u2014 " +
  "re-map with /code-flow.map --whole-code-base to trace them";
var SKIP_REASONS = {
  "duplicate-intent": "a thin map carries no snippet, so this detector had no evidence to compare — " +
    "re-run the quality command with --read-code, or re-map with --detail standard",
  "repeated-sequence": NO_FLOWS,
  "complexity-hotspot": NO_FLOWS,
  "unreached": NO_FLOWS,
  "rule-violation": "no rule could be read from the sources given to --rules, so there was " +
    "nothing to check against — every other detector is unaffected",
  "single-responsibility": NO_GRAPH,
  "interface-segregation": NO_GRAPH,
  "dependency-cycle": NO_GRAPH,
  "pass-through": NO_GRAPH,
  "internals-coupled-test": NO_GRAPH,
  /* The only two whose evidence was never in the map. They locate candidates
     from it and let --read-code settle them, so without the flag there is
     nothing for them to report rather than something they got wrong. */
  "open-closed": NO_SOURCE,
  "liskov-substitution": NO_SOURCE
};
var skipped = Array.isArray(coverage.detectorsSkipped) ? coverage.detectorsSkipped : [];
if (skipped.length){
  skipped.forEach(function(name){
    var why = SKIP_REASONS[name] || "reason not recorded in this report";
    fact(String(name) + " did not run: " + why, true);
  });
} else {
  fact("No detectors were skipped");
}
/* A detector that ran and found nothing looks exactly like one that never ran:
   the findings list simply carries no row with its name. On a report where every
   SOLID and DEPTH detector was clean, that reads as SOLID never having been
   checked -- the inference `detectorsSkipped` exists to prevent, arriving
   through the other door. So the clean ones are named too. The set is derived
   rather than kept: every detector, less the ones step 2 skipped, less the ones
   that reported. */
var ALL_DETECTORS = ["duplicate-intent", "repeated-sequence", "complexity-hotspot",
  "unreached", "single-responsibility", "interface-segregation", "dependency-cycle",
  "shallow-module", "pass-through", "internals-coupled-test", "open-closed",
  "liskov-substitution", "rule-violation"];
var reportedBy = {};
findings.forEach(function(f){ if (f && f.detector) reportedBy[String(f.detector)] = 1; });
var skippedBy = {};
skipped.forEach(function(name){ skippedBy[String(name)] = 1; });
var clean = ALL_DETECTORS.filter(function(name){
  /* rule-violation checks rules somebody wrote down. With none loaded it neither
     ran nor was skipped, so it is not clean -- it has nothing to be clean about. */
  if (name === "rule-violation" && !coverage.rulesLoaded) return false;
  return !skippedBy[name] && !reportedBy[name];
});
if (clean.length){
  fact("Ran and found nothing: " + clean.join(", "));
}
el("p", "note", "Discovery was Glob, Grep and Read — not a parser. These counts describe " +
  "what the map catalogued, and anything it never reached was never examined.", banner);

/* ---- findings ---- */
if (!findings.length){
  /* The most over-read screen in the product. It says what an empty findings
     array actually means, in words, and deliberately carries no checkmark, no
     green, and no empty-state illustration. */
  var none = el("section", "no-findings");
  el("h2", null, "No findings — clean within what was mapped", none);
  el("p", null, "This is not a clean bill of health. The detectors only saw " +
    (traced !== null && entries !== null
      ? traced + " of " + entries + " entry " + plural(entries, "point", "points")
      : "the portion of the repository the map reached") +
    ", and code outside that was never examined. Read this together with the coverage above.", none);
  el("p", null, "A clean result here means the detectors that ran found nothing they could " +
    "cite evidence for in the mapped portion. It is not a statement about the repository.", none);
} else {
  var section = el("section", "findings");
  var bar = el("div", "filters", null, section);

  function chooser(id, label, options){
    var wrap = el("label", "filter", null, bar);
    el("span", null, label, wrap);
    var sel = document.createElement("select");
    sel.id = id;
    options.forEach(function(pair){
      var opt = document.createElement("option");
      opt.value = pair[0];
      opt.textContent = pair[1];
      sel.appendChild(opt);
    });
    wrap.appendChild(sel);
    sel.addEventListener("change", applyFilters);
    return sel;
  }
  var bySeverity = chooser("filter-severity", "Severity",
    [["", "any"], ["high", "high"], ["medium", "medium"], ["low", "low"]]);
  var byPrinciple = chooser("filter-principle", "Principle",
    [["", "any"], ["DRY", "DRY"], ["KISS", "KISS"], ["YAGNI", "YAGNI"],
    ["SOLID", "SOLID"], ["DEPTH", "DEPTH"], ["RULES", "RULES"]]);
  var shownCount = el("div", "count", null, bar);
  el("div", "hint", "Findings appear in the order the analysis produced them — by severity, " +
    "then site count, then principle. The filters hide rows; they never reorder them.", section);

  var list = el("div", "findings-list", null, section);
  var cards = [];

  findings.forEach(function(f){
    var card = el("article", "finding sev-" + f.severity, null, list);
    cards.push({ f: f, el: card });

    var head = el("div", "fhead", null, card);
    el("span", "fid mono", f.id, head);
    el("span", "chip sev-" + f.severity, f.severity, head);
    el("span", "chip", f.principle, head);
    el("span", "chip", f.detector, head);
    el("span", "chip conf-" + f.confidence, f.confidence, head);
    if (f.effort) el("span", "chip", "effort: " + f.effort, head);

    el("h3", null, f.title, card);
    if (f.rationale) el("p", null, f.rationale, card);

    if (f.detector === "unreached"){
      el("p", "candidate-note", "An unreached function is a candidate for review, never a verdict: " +
        "parser-free tracing cannot see every caller. Confirm the call sites " +
        "yourself before acting on this.", card);
    }

    var evidence = [];
    if (Array.isArray(f.flows) && f.flows.length) evidence.push(["flows", f.flows.join(", ")]);
    // A rule-violation finding rests on a sentence somebody wrote down. Show
    // that sentence and where it came from: a reader who cannot see the rule
    // cannot tell a real violation from a misreading of it.
    if (f.rule) evidence.push([f.ruleId ? "rule " + f.ruleId : "rule", String(f.rule)]);
    if (f.ruleSource) evidence.push(["rule source", String(f.ruleSource)]);
    if (f.metric != null){
      evidence.push(["metric", String(f.metric) + (f.value != null ? " = " + f.value : "")]);
    } else if (f.value != null){
      evidence.push(["value", String(f.value)]);
    }
    if (typeof f.exported === "boolean") evidence.push(["exported", f.exported ? "yes" : "no"]);
    if (f.reachedBy){
      evidence.push(["reached by", f.reachedBy === "tests" ? "its own tests only" : String(f.reachedBy)]);
    }
    // The SOLID and DEPTH detectors are the only ones whose claim is a number about
    // a whole file rather than about a line of code. Show that number beside the
    // sites: without it a reader sees five cited functions and no way to check the
    // threshold the finding says they tripped.
    if (f.module) evidence.push(["module", String(f.module)]);
    if (f.dependencies != null){
      evidence.push(["module dependencies", String(f.dependencies) + " out" +
        (f.dependents != null ? ", " + f.dependents + " in" : "")]);
    }
    if (f.exports != null){
      evidence.push(["exported surface", String(f.exports) + " exported, " + String(f.consumers) +
        " " + plural(f.consumers, "consumer", "consumers") + ", widest uses " + String(f.widestConsumerUse)]);
    }
    if (Array.isArray(f.cycle) && f.cycle.length) evidence.push(["cycle", f.cycle.join(" \u2192 ")]);
    if (f.interface != null){
      evidence.push(["module depth", String(f.interface) + " exported, " + String(f.hiddenLoc) +
        " lines behind them"]);
    }
    if (Array.isArray(f.internals) && f.internals.length){
      evidence.push(["internals reached", f.internals.join(", ")]);
    }
    if (Array.isArray(f.variants) && f.variants.length){
      /* repeated-sequence collapses every chain sharing a pair of endpoints
         into one row, so the count says how much this single row stands for.
         Without it a group of four reads as a group of one. */
      evidence.push(["variants", f.variants.join(", ") +
        (f.occurrences != null ? " (" + f.occurrences + " " +
          plural(f.occurrences, "chain", "chains") + ")" : "")]);
    }
    if (f.switchPoint) evidence.push(["selected at", String(f.switchPoint)]);
    if (f.family){
      /* Whether the family was stated by the source or matched by name is the one
         thing that decides how much a reader should trust the finding, so it rides
         beside the family rather than in the rationale where it can be skipped. */
      evidence.push(["override family", String(f.family) +
        (f.familyFrom === "overrides" ? " (stated by the source)" :
         f.familyFrom === "name" ? " (matched by name)" : "")]);
    }
    if (Array.isArray(f.weakened) && f.weakened.length){
      evidence.push(["weakens the contract", f.weakened.join(", ")]);
    }
    if (evidence.length){
      var dl = el("dl", "evidence", null, card);
      evidence.forEach(function(pair){
        el("dt", null, pair[0], dl);
        el("dd", null, pair[1], dl);
      });
    }

    el("h4", null, plural(f.sites.length, "Site", "Sites"), card);
    var sites = el("ul", "sites", null, card);
    f.sites.forEach(function(s){
      var li = el("li", null, null, sites);
      el("div", "loc mono", String(s.file) + ":" + String(s.line), li);
      if (s.symbol) el("div", "sym mono", String(s.symbol), li);
      /* A missing snippet is normal: a thin map read without --read-code has
         none. Say so quietly; it is not an error. */
      if (s.snippet) el("pre", "mono", String(s.snippet), li);
      else el("div", "nosnip", "no snippet in the map", li);
    });

    if (f.suggestion){
      var sg = el("div", "suggestion", null, card);
      el("span", "lbl", "Suggestion", sg);
      el("span", null, f.suggestion, sg);
    }
  });

  var filterEmpty = el("div", "filter-empty", null, section);
  filterEmpty.hidden = true;

  function applyFilters(){
    var wantSeverity = bySeverity.value, wantPrinciple = byPrinciple.value, shown = 0;
    cards.forEach(function(c){
      var keep = (!wantSeverity || c.f.severity === wantSeverity) &&
                 (!wantPrinciple || c.f.principle === wantPrinciple);
      c.el.hidden = !keep;
      if (keep) shown++;
    });
    shownCount.textContent = (shown === findings.length)
      ? findings.length + " " + plural(findings.length, "finding", "findings")
      : "showing " + shown + " of " + findings.length + " findings";
    filterEmpty.textContent = "No finding matches the current filter. That is a filter " +
      "result and says nothing about the code — widen the filters to see the findings again.";
    filterEmpty.hidden = shown !== 0;
  }
  applyFilters();
}

/* ---- theme: same control and same localStorage key as the flow viewer, so the
   two artifacts agree about a user's choice ---- */
var rootEl = document.documentElement;
function setTheme(t){ rootEl.setAttribute("data-theme", t); try { localStorage.setItem("codeflow-theme", t); } catch (e) {} }
var saved = null; try { saved = localStorage.getItem("codeflow-theme"); } catch (e) {}
rootEl.setAttribute("data-theme", saved || "dark");
themeBtn.addEventListener("click", function(){
  setTheme(rootEl.getAttribute("data-theme") === "light" ? "dark" : "light");
});
})();
</script>
</body>
</html>
