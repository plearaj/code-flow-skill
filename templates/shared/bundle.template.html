<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Flow — Bundle</title>
<style>
/* ============ theme tokens (union of the three source scaffolds) ============ */
:root{
  color-scheme:dark;
  /* Nocturne, inlined: this page is a single self-contained file, so the design
     system's tokens are carried here rather than linked. */
  --bg:#161826; --bg-2:#1b1d2c; --panel:#232532; --raise:#2b2d3b; --code:#14161f;
  --border:#3f424d; --border-strong:#595d6c;
  --text:#e9e9ed; --dim:#9397ab; --faint:#75798c;
  --accent:#9184d9; --accent-soft:#b5abfc; --accent-dim:#5d5294; --err:#d98a95; --ok:#b5abfc;
  --grid:#1e2130; --edge:#75798c; --edge-soft:#454956;
  --node-entry:#2b2741; --node-entry-s:#5d5294; --node-entry-a:#b5abfc;
  --node-step:#232532;  --node-step-s:#3f424d;  --node-step-a:#9397ab;
  --node-ext:#262a60;   --node-ext-s:#4c5397;   --node-ext-a:#a7a1db;
  --node-io:#292b31;    --node-io-s:#595d6c;    --node-io-a:#cfd3e5;
  --node-component:#2f2839; --node-component-s:#6b5aa0; --node-component-a:#c9b8f2;
  --lane:rgba(233,233,237,.02); --lane-line:rgba(233,233,237,.06);
  --high:#b5abfc; --medium:#796cbf; --low:#595d6c;
  --section:#262a60; --section-ghost:#4c5397;
  --shadow:0 0 0 1px #3f424d, 0 6px 18px rgba(0,0,0,.5);
  --glow:0 0 0 1px rgba(145,132,217,.4), 0 6px 24px rgba(145,132,217,.14);
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f5fe; --bg-2:#e4e7f5; --panel:#fbfbff; --raise:#eceffb; --code:#eef0fa;
  --border:#cfd3e5; --border-strong:#b2b6ca;
  --text:#292b31; --dim:#595d6c; --faint:#75798c;
  --accent:#5d5294; --accent-soft:#796cbf; --accent-dim:#b5abfc; --err:#8d3f4a; --ok:#5d5294;
  --grid:#e4e7f5; --edge:#75798c; --edge-soft:#b2b6ca;
  --node-entry:#e7e5fe; --node-entry-s:#b5abfc; --node-entry-a:#5d5294;
  --node-step:#eceffb;  --node-step-s:#cfd3e5;  --node-step-a:#75798c;
  --node-ext:#e3e5f6;   --node-ext-s:#9690c9;   --node-ext-a:#423a6a;
  --node-io:#e9ebf6;    --node-io-s:#b2b6ca;    --node-io-a:#3f424d;
  --node-component:#efe9fb; --node-component-s:#c3b2ef; --node-component-a:#4a3d7a;
  --lane:rgba(41,43,49,.025); --lane-line:rgba(41,43,49,.07);
  --high:#423a6a; --medium:#796cbf; --low:#75798c;
  --section:#d2cefd; --section-ghost:#9690c9;
  --shadow:0 0 0 1px #cfd3e5, 0 6px 18px rgba(41,43,49,.08);
  --glow:0 0 0 1px rgba(93,82,148,.35), 0 6px 20px rgba(93,82,148,.12);
}
__THEME_CSS__
/* ============ app frame, shared by all three views ============ */
*{box-sizing:border-box; margin:0}
html,body{height:100%; background:var(--bg)}
[hidden]{display:none !important}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.mono{font-family:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace}

/* ---- fatal error card: the whole bundle failed to parse or validate ---- */
#err{max-width:640px; margin:10vh auto; padding:0 24px}
#err>div{border:1px solid var(--border); border-top:2px solid var(--err); border-radius:12px;
  background:var(--panel); box-shadow:var(--shadow); padding:20px 22px}
#err h2{color:var(--err); font-size:12px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:10px}
#err pre{white-space:pre-wrap; word-break:break-word; font-size:12.5px; line-height:1.7;
  font-family:ui-monospace,"Cascadia Code",Menlo,Consolas,monospace}

/* ================================================================
   #view-index — adapted from index.template.html
   ================================================================ */
#view-index{background:var(--bg); color:var(--text); min-height:100vh;
  font:14px/1.6 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif; font-weight:400;
  -webkit-font-smoothing:antialiased}
#view-index #idx-app{max-width:980px; margin:0 auto; padding:0 30px 110px}
#view-index a{color:var(--accent); text-decoration:none}
#view-index a:hover{color:var(--text)}
#view-index h1,#view-index h2,#view-index h3{font-weight:500; letter-spacing:-.015em; line-height:1.15}
#view-index .fade-rule{height:1px; border:0;
  background:linear-gradient(90deg, transparent, var(--border) 48px, var(--border) calc(100% - 48px), transparent)}
#view-index #idx-err{max-width:980px; margin:30px auto; padding:0 30px}
#view-index #idx-err>div{border:1px solid var(--border); border-top:2px solid var(--err); border-radius:8px;
  background:var(--panel); box-shadow:var(--shadow); padding:20px 22px}
#view-index #idx-err h2{color:var(--err); font-size:12px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:10px}
#view-index #idx-err pre{white-space:pre-wrap; word-break:break-word; font-size:12.5px; line-height:1.7;
  font-family:ui-monospace,"Cascadia Code",Menlo,Consolas,monospace}
#view-index .topbar{display:flex; align-items:flex-start; gap:16px; padding:44px 0 22px}
#view-index .kicker{font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent)}
#view-index .topbar h1{margin-top:10px; font-size:27px}
#view-index .topbar .sub{margin-top:11px; font-size:11.5px; line-height:1.85; color:var(--faint); word-break:break-all;
  font-family:ui-monospace,Menlo,Consolas,monospace}
#view-index .topbar .spacer{flex:1}
#view-index .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; height:32px; padding:0 13px;
  border:1px solid var(--border); border-radius:8px; background:transparent; color:var(--dim);
  font:12px "Inter",system-ui,sans-serif; cursor:pointer; flex:none; text-decoration:none;
  transition:border-color .14s,color .14s,background .14s}
#view-index .btn:hover{border-color:var(--border-strong); color:var(--text); background:color-mix(in srgb, var(--text) 7%, transparent)}
#view-index .btn:active{background:color-mix(in srgb, var(--text) 14%, transparent)}
#view-index .btn-accent{border-color:var(--accent); color:var(--accent)}
#view-index .btn-accent:hover{color:var(--accent-soft); border-color:var(--accent-soft);
  background:color-mix(in srgb, var(--accent) 12%, transparent)}
#view-index .btn-accent:active{background:color-mix(in srgb, var(--accent) 22%, transparent)}
#view-index .coverage{margin-top:30px; display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px;
  border:1px solid var(--border); border-radius:8px; background:var(--border); overflow:hidden}
#view-index .coverage .cell{background:var(--panel); padding:15px 17px 16px}
#view-index .coverage b{display:block; font-size:25px; font-weight:500; letter-spacing:-.03em; line-height:1.1;
  font-variant-numeric:tabular-nums}
#view-index .coverage span{display:block; margin-top:5px; font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--faint)}
#view-index .coverage .cell.lit b{color:var(--accent-soft)}
#view-index .notes{margin-top:13px; display:flex; flex-direction:column; gap:6px}
#view-index .note{font-size:12.5px; line-height:1.65; color:var(--dim); padding-left:16px; position:relative; text-wrap:pretty}
#view-index .note::before{content:""; position:absolute; left:2px; top:8px; width:5px; height:5px; border-radius:50%;
  background:var(--faint)}
#view-index .note.warn{color:var(--accent-soft)}
#view-index .note.warn::before{background:var(--accent)}
#view-index .sechead{display:flex; align-items:baseline; gap:12px; margin:46px 0 16px}
#view-index .sechead h2{font-size:16px}
#view-index .sechead .n{font-size:11px; color:var(--faint); font-family:ui-monospace,Menlo,monospace}
#view-index .sechead .spacer{flex:1}
#view-index .flows{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px}
#view-index .flow{position:relative; display:flex; flex-direction:column; gap:11px; padding:17px 18px 15px;
  border:1px solid var(--border); border-radius:8px; background:var(--panel); box-shadow:var(--shadow);
  transition:border-color .16s,transform .16s; cursor:pointer}
#view-index .flow:hover{border-color:var(--accent); transform:translateY(-2px)}
#view-index .flow:focus-visible{border-color:var(--accent)}
#view-index .flow .mark{position:absolute; left:0; top:17px; width:2px; height:19px; background:var(--accent)}
#view-index .flow .title{font-size:17px; font-weight:500; letter-spacing:-.015em; line-height:1.25; color:var(--text);
  text-wrap:pretty}
#view-index .flow .slug{font-size:11px; color:var(--faint); font-family:ui-monospace,Menlo,Consolas,monospace;
  word-break:break-all}
#view-index .flow .facts{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-top:1px}
#view-index .tag{display:inline-flex; align-items:center; gap:5px; height:21px; padding:0 8px; border-radius:4px;
  border:1px solid var(--border); color:var(--dim); font-size:10px; letter-spacing:.09em; text-transform:uppercase}
#view-index .tag.accent{border-color:var(--accent-dim); color:var(--accent-soft)}
#view-index .flow .entry{font-size:11.5px; color:var(--dim); font-family:ui-monospace,Menlo,Consolas,monospace;
  word-break:break-all}
#view-index .flow .sides{display:flex; align-items:center; gap:12px; margin-top:auto; padding-top:12px;
  border-top:1px solid var(--border); font-size:11px}
#view-index .flow .open{margin-left:auto; color:var(--accent); font-size:11.5px}
#view-index .empty{border:1px dashed var(--border-strong); border-radius:8px; padding:20px 22px; color:var(--dim);
  font-size:13px; line-height:1.7; text-wrap:pretty}
#view-index .report{display:flex; align-items:center; gap:16px; padding:17px 19px; border:1px solid var(--border);
  border-radius:8px; background:var(--panel); box-shadow:var(--shadow)}
#view-index .report .t{font-size:15px; font-weight:500}
#view-index .report .d{margin-top:3px; font-size:12px; color:var(--faint)}
#view-index .report .spacer{flex:1}
#view-index details.census{margin-top:16px; border:1px solid var(--border); border-radius:8px; background:var(--panel)}
#view-index details.census>summary{cursor:pointer; padding:14px 18px; font-size:13px; color:var(--dim);
  display:flex; align-items:center; gap:9px; list-style:none}
#view-index details.census>summary::-webkit-details-marker{display:none}
#view-index details.census>summary::before{content:"▸"; color:var(--faint); font-size:10px; transition:transform .16s}
#view-index details.census[open]>summary::before{transform:rotate(90deg)}
#view-index details.census>summary:hover{color:var(--text)}
#view-index .censusbody{border-top:1px solid var(--border); padding:14px 18px 18px}
#view-index .censusbody .filter{display:flex; align-items:center; gap:10px; margin-bottom:12px}
#view-index .censusbody input{flex:1; min-width:0; height:32px; padding:0 11px; border:1px solid var(--border);
  border-radius:8px; background:var(--bg-2); color:var(--text); caret-color:var(--accent);
  font:12px ui-monospace,Menlo,Consolas,monospace}
#view-index .censusbody input::placeholder{color:var(--faint)}
#view-index .censusbody input:hover{border-color:var(--border-strong)}
#view-index .censusbody input:focus-visible{border-color:var(--accent); outline-offset:0}
#view-index .censusbody .fcount{font-size:11px; color:var(--faint); font-family:ui-monospace,Menlo,monospace}
#view-index table.files{width:100%; border-collapse:collapse; font-size:12px}
#view-index table.files th{text-align:left; padding:6px 10px 8px 0; font-size:9.5px; font-weight:500; letter-spacing:.12em;
  text-transform:uppercase; color:var(--faint); border-bottom:1px solid var(--border); white-space:nowrap}
#view-index table.files th.num,#view-index table.files td.num{text-align:right; padding-right:0; font-variant-numeric:tabular-nums}
#view-index table.files td.barcell{padding-left:14px; padding-right:14px; width:78px; text-align:left}
#view-index table.files td{padding:6px 10px 6px 0; border-bottom:1px solid color-mix(in srgb, var(--border) 55%, transparent);
  font-family:ui-monospace,Menlo,Consolas,monospace; word-break:break-all}
#view-index table.files tr:last-child td{border-bottom:0}
#view-index table.files td.p{color:var(--text)}
#view-index table.files td.h{color:var(--faint); white-space:nowrap}
#view-index table.files .bar{display:block; height:3px; border-radius:2px; background:var(--section-ghost); min-width:2px}
@media (max-width:620px){ #view-index table.files th.h,#view-index table.files td.h{display:none} }

/* ================================================================
   #view-report — adapted from report.template.html
   ================================================================ */
#view-report{background:
    radial-gradient(120% 60% at 50% 0%, var(--bg-2) 0%, transparent 60%),
    var(--bg);
  background-attachment:fixed; color:var(--text); min-height:100vh;
  font:14px/1.65 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased}
#view-report #rep-app{max-width:880px; margin:0 auto; padding:0 28px 96px}
#view-report a{color:var(--accent)} #view-report a:hover{color:var(--text)}
#view-report #rep-err{max-width:880px; margin:28px auto; padding:0 28px}
#view-report #rep-err>div{border:1px solid var(--border); border-top:2px solid var(--err); border-radius:12px;
  background:var(--panel); box-shadow:var(--shadow); padding:20px 22px}
#view-report #rep-err h2{color:var(--err); font-size:12px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:10px}
#view-report #rep-err pre{white-space:pre-wrap; word-break:break-word; font-size:12.5px; line-height:1.7;
  font-family:ui-monospace,"Cascadia Code",Menlo,Consolas,monospace}
#view-report .topbar{display:flex; align-items:flex-start; gap:14px; padding:34px 0 20px; border-bottom:1px solid var(--border)}
#view-report .topbar h1{font-size:22px; line-height:1.2; letter-spacing:-.02em; font-weight:500}
#view-report .topbar .sub{margin-top:8px; font-size:11.5px; line-height:1.8; color:var(--faint); word-break:break-word;
  font-family:ui-monospace,Menlo,Consolas,monospace}
#view-report .topbar .spacer{flex:1}
#view-report button.ghost{height:32px; min-width:32px; padding:0 12px; border:1px solid var(--border); border-radius:9px;
  background:var(--bg-2); color:var(--dim); font:12px/1 "Inter",system-ui,sans-serif; cursor:pointer; flex:none;
  transition:border-color .14s,color .14s}
#view-report button.ghost:hover,#view-report a.ghost:hover{border-color:var(--border-strong); color:var(--text)}
#view-report a.ghost{display:inline-flex; align-items:center; height:32px; padding:0 12px; border:1px solid var(--border);
  border-radius:9px; background:var(--bg-2); color:var(--dim); font-size:12px; text-decoration:none; flex:none;
  transition:border-color .14s,color .14s}
#view-report .coverage-banner{margin-top:26px; border:1px solid var(--border); border-radius:14px;
  background:linear-gradient(180deg, var(--raise), var(--panel)); box-shadow:var(--shadow);
  padding:20px 22px; position:relative; overflow:hidden}
#view-report .coverage-banner::before{content:""; position:absolute; inset:0 0 auto 0; height:2px;
  background:linear-gradient(90deg, var(--accent), transparent 70%)}
#view-report .coverage-banner h2{font-size:10px; letter-spacing:.18em; text-transform:uppercase; font-weight:700; color:var(--accent)}
#view-report .coverage-banner .lead{margin-top:11px; font-size:15px; line-height:1.6; text-wrap:pretty}
#view-report .coverage-banner .lead.partial{font-weight:600}
#view-report .coverage-banner ul.facts{list-style:none; margin-top:16px; display:grid; gap:0}
#view-report .coverage-banner ul.facts li{font-size:13px; line-height:1.5; padding:8px 0 8px 22px; position:relative;
  border-top:1px solid var(--border)}
#view-report .coverage-banner ul.facts li:first-child{border-top:0}
#view-report .coverage-banner ul.facts li::before{content:""; position:absolute; left:4px; top:15px;
  width:6px; height:6px; border-radius:50%; background:var(--faint)}
#view-report .coverage-banner ul.facts li.warn{color:var(--err)}
#view-report .coverage-banner ul.facts li.warn::before{background:var(--err)}
#view-report .coverage-banner .note{margin-top:14px; padding-top:13px; border-top:1px solid var(--border);
  font-size:12px; line-height:1.7; color:var(--faint); text-wrap:pretty}
#view-report .no-findings{margin-top:26px; border:1px solid var(--accent-dim); border-radius:14px;
  background:var(--panel); box-shadow:var(--shadow); padding:22px 24px}
#view-report .no-findings h2{font-size:17px; line-height:1.35; font-weight:500; letter-spacing:-.01em}
#view-report .no-findings p{margin-top:11px; font-size:13.5px; line-height:1.7; color:var(--dim); text-wrap:pretty}
#view-report .filters{display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin-top:38px;
  position:sticky; top:0; z-index:5; padding:12px 14px; border:1px solid var(--border); border-radius:12px;
  background:color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter:blur(8px); box-shadow:var(--shadow)}
#view-report .filters .filter{display:flex; align-items:center; gap:7px; font-size:11px; color:var(--faint);
  letter-spacing:.08em; text-transform:uppercase}
#view-report .filters select{height:28px; padding:0 8px; border:1px solid var(--border); border-radius:8px;
  background:var(--bg-2); color:var(--text); font:12px "Inter",system-ui,sans-serif; cursor:pointer;
  letter-spacing:0; text-transform:none}
#view-report .filters select:hover{border-color:var(--border-strong)}
#view-report .filters .count{margin-left:auto; font-size:11.5px; color:var(--dim); font-variant-numeric:tabular-nums;
  font-family:ui-monospace,Menlo,monospace}
#view-report .hint{margin-top:12px; font-size:11.5px; line-height:1.7; color:var(--faint); text-wrap:pretty}
#view-report .filter-empty{margin-top:18px; border:1px dashed var(--border-strong); border-radius:12px;
  padding:16px 18px; font-size:13px; line-height:1.65; color:var(--dim)}
#view-report .findings-list{margin-top:18px; display:grid; grid-template-columns:minmax(0,1fr); gap:18px}
#view-report .finding{border:1px solid var(--border); border-radius:14px; background:var(--panel);
  box-shadow:var(--shadow); padding:18px 20px 20px; position:relative; overflow:hidden;
  transition:border-color .16s}
#view-report .finding::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--low)}
#view-report .finding:hover{border-color:var(--border-strong)}
#view-report .finding.sev-high::before{background:var(--high)}
#view-report .finding.sev-medium::before{background:var(--medium)}
#view-report .finding.sev-low::before{background:var(--low)}
#view-report .fhead{display:flex; align-items:center; flex-wrap:wrap; gap:7px}
#view-report .fid{font-size:11.5px; font-weight:650; letter-spacing:.04em; color:var(--dim); margin-right:2px}
#view-report .chip{font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; line-height:1.6;
  color:var(--dim); border:1px solid var(--border); border-radius:6px; padding:2px 8px; background:var(--bg-2)}
#view-report .chip.sev-high{background:var(--high); border-color:var(--high); color:#161826; font-weight:700}
#view-report .chip.sev-medium{color:var(--medium); border-color:var(--medium); background:transparent}
#view-report .chip.sev-low{color:var(--dim); border-color:var(--border-strong); background:transparent}
#view-report .chip.conf-unverified{color:var(--err); border:1px dashed var(--err); background:transparent}
#view-report .finding h3{margin-top:13px; font-size:16.5px; line-height:1.35; font-weight:500; letter-spacing:-.015em; text-wrap:pretty}
#view-report .finding p{margin-top:9px; font-size:13.5px; line-height:1.7; color:var(--dim); text-wrap:pretty}
#view-report .candidate-note{margin-top:11px; border-left:2px solid var(--accent-dim); padding:3px 0 3px 13px;
  color:var(--dim); font-size:12.5px; line-height:1.65}
#view-report dl.evidence{margin-top:14px; display:grid; grid-template-columns:auto 1fr; gap:0 16px; font-size:12.5px;
  border:1px solid var(--border); border-radius:10px; padding:10px 12px; background:var(--bg-2)}
#view-report dl.evidence dt{color:var(--faint); text-transform:uppercase; font-size:9.5px; font-weight:700; letter-spacing:.1em; padding:4px 0}
#view-report dl.evidence dd{line-height:1.5; padding:4px 0; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px}
#view-report .finding h4{margin-top:18px; font-size:10px; letter-spacing:.14em; text-transform:uppercase; font-weight:700;
  color:var(--faint); display:flex; align-items:center; gap:9px}
#view-report .finding h4::after{content:""; flex:1; height:1px; background:var(--border)}
#view-report ul.sites{list-style:none; margin-top:10px; display:grid; grid-template-columns:minmax(0,1fr); gap:10px}
#view-report ul.sites li{border:1px solid var(--border); border-radius:11px; background:var(--bg-2); padding:10px 13px 12px}
#view-report ul.sites .loc{font-size:12.5px; font-weight:650; word-break:break-all; color:var(--text)}
#view-report ul.sites .sym{font-size:11.5px; color:var(--faint); margin-top:2px}
#view-report ul.sites pre{margin-top:9px; background:var(--code); border:1px solid var(--border); border-radius:9px;

/* The minimap is a navigation luxury and genuinely unusable this small, so it
   still drops at 900px. The panel is the only way to inspect a node — click,
   read description/file:line/snippet, walk callers and callees — so it earns
   a narrower width instead of disappearing, and survives down to a tablet in
   portrait (768px). */

<div id="err" hidden></div>

        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5"/><path d="M8 3v10" stroke-width="0"/><path d="M8 3a5 5 0 0 1 0 10z" fill="currentColor" stroke="none"/></svg>

    <aside id="panel"></aside>

    vb.y -= (e.clientY - drag.y) * vb.h / r.height;
    if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 3) drag.moved = true;
    drag.x = e.clientX; drag.y = e.clientY; applyVB();
  };
  svgEl.onpointerup = function(){
    if (drag && !drag.moved) select(null);
    drag = null; canvasEl.classList.remove("panning");
  };
  svgEl.onwheel = function(e){
    e.preventDefault();
    var r = svgEl.getBoundingClientRect();
    zoomAt(e.deltaY < 0 ? 0.86 : 1.16, e.clientX - r.left, e.clientY - r.top);
  };
  function centerOn(n){
    var tx = n.x + NW / 2 - vb.w / 2, ty = n.y + NH / 2 - vb.h / 2;
    var sx = vb.x, sy = vb.y, t0 = performance.now();
    (function step(t){
      var k = Math.min(1, (t - t0) / 260), e = 1 - Math.pow(1 - k, 3);
      vb.x = sx + (tx - sx) * e; vb.y = sy + (ty - sy) * e; applyVB();
      if (k < 1) requestAnimationFrame(step);
    })(t0);
  }

  var MINI_MAX = 190;
  function drawMini(){
    var w = bounds.x1 - bounds.x0, h = bounds.y1 - bounds.y0;
    if (!w || !h){ miniEl.hidden = true; return; }
    miniEl.hidden = visible.size < 12;
    var sc = Math.min(MINI_MAX / w, 130 / h);
    minisvgEl.setAttribute("width", Math.max(60, Math.round(w * sc)));
    minisvgEl.setAttribute("height", Math.max(40, Math.round(h * sc)));
    minisvgEl.setAttribute("viewBox", bounds.x0 + " " + bounds.y0 + " " + w + " " + h);
    mininodesEl.innerHTML = "";
    nodes.forEach(function(n){
      if (!visible.has(n.id)) return;
      var r = sEl("rect", { "class": "mn", x: n.x, y: n.y, width: NW, height: NH, rx: 6 }, mininodesEl);
      r.style.fill = "var(--node-" + (n.kindN === "external" ? "ext" : n.kindN) + "-a)";
      r.style.opacity = n.id === selId ? "1" : ".55";
    });
    updateMiniVP();
  }
  function updateMiniVP(){
    minivpEl.setAttribute("x", vb.x); minivpEl.setAttribute("y", vb.y);
    minivpEl.setAttribute("width", Math.max(1, vb.w)); minivpEl.setAttribute("height", Math.max(1, vb.h));
  }
  function miniJump(e){
    var r = minisvgEl.getBoundingClientRect(), w = bounds.x1 - bounds.x0, h = bounds.y1 - bounds.y0;
    var gx = bounds.x0 + (e.clientX - r.left) / r.width * w;
    var gy = bounds.y0 + (e.clientY - r.top) / r.height * h;
    vb.x = gx - vb.w / 2; vb.y = gy - vb.h / 2; applyVB();
  }
  var mdrag = false;
  minisvgEl.onpointerdown = function(e){ mdrag = true; minisvgEl.setPointerCapture(e.pointerId); miniJump(e); };
  minisvgEl.onpointermove = function(e){ if (mdrag) miniJump(e); };
  minisvgEl.onpointerup = function(){ mdrag = false; };

  function bfsSet(start, useIn){
    var seen = new Set(), q = [start];
    while (q.length){
      var id = q.shift();
      (useIn ? inF : outF).get(id).forEach(function(e){
        var nx = useIn ? e.from : e.to;
        if (visible.has(nx) && !seen.has(nx)){ seen.add(nx); q.push(nx); }
      });
    }
    return seen;
  }
  function applyState(){
    var anc = null, des = null;
    if (selId && visible.has(selId)){ anc = bfsSet(selId, true); des = bfsSet(selId, false); }
    nodeEls.forEach(function(el, id){
      var dimSearch = matchSet && !matchSet.has(id);
      var rel = !anc || id === selId || anc.has(id) || des.has(id);
      el.classList.toggle("faded", !!(dimSearch || !rel));
      el.classList.toggle("sel", id === selId);
      el.classList.toggle("match", !!(matchSet && matchSet.has(id)));
    });
    edgeEls.forEach(function(o){
      var e = o.e, hot = false, rel = true;
      if (anc){
        hot = ((e.to === selId || anc.has(e.to)) && anc.has(e.from)) ||
              ((e.from === selId || des.has(e.from)) && des.has(e.to));
        rel = hot;
      }
      var dimSearch = matchSet && !(matchSet.has(e.from) && matchSet.has(e.to));
      o.el.classList.toggle("faded", !!(dimSearch || !rel));
      o.el.classList.toggle("hot", !!(hot && !dimSearch));
    });
    drawMini();
  }
  function select(id){
    selId = id; renderPanel(); applyState(); renderCrumbs();
  }
  function pathTo(id){
    var prev = new Map(), q = roots.filter(function(r){ return visible.has(r.id); }).map(function(r){ return r.id; });
    var seen = new Set(q);
    while (q.length){
      var cur = q.shift();
      if (cur === id) break;
      outF.get(cur).forEach(function(e){
        if (visible.has(e.to) && !seen.has(e.to)){ seen.add(e.to); prev.set(e.to, cur); q.push(e.to); }
      });
    }
    if (!seen.has(id)) return [id];
    var out = [id], c = id;
    while (prev.has(c)){ c = prev.get(c); out.unshift(c); }
    return out;
  }
  function renderCrumbs(){
    crumbsEl.innerHTML = "";
    if (!selId || !visible.has(selId)){
      var h = document.createElement("span"); h.className = "hint";
      h.textContent = "click a node to trace its path  ·  " + visible.size + " of " + nodes.length + " nodes shown";
      crumbsEl.appendChild(h); return;
    }
    pathTo(selId).forEach(function(id, i){
      if (i){ var s = document.createElement("span"); s.className = "sep"; s.textContent = "›"; crumbsEl.appendChild(s); }
      var b = document.createElement("span");
      b.className = "cb"; b.textContent = byId.get(id).label || id;
      b.addEventListener("click", function(){ select(id); centerOn(byId.get(id)); });
      crumbsEl.appendChild(b);
    });
  }

  var playing = 0;
  function play(){
    if (playing){ playing = 0; document.getElementById("playbtn").setAttribute("aria-pressed", "false"); clearLit(); return; }
    var token = ++playing;
    document.getElementById("playbtn").setAttribute("aria-pressed", "true");
    var order = [], seen = new Set(), q = roots.filter(function(r){ return visible.has(r.id); }).map(function(r){ return r.id; });
    q.forEach(function(id){ seen.add(id); });
    while (q.length){
      var cur = q.shift(); order.push(cur);
      outF.get(cur).forEach(function(e){
        if (!visible.has(e.to)) return;
        if (!seen.has(e.to)){ seen.add(e.to); q.push(e.to); }
      });
    }
    clearLit();
    var i = 0;
    (function tick(){
      if (playing !== token) return;
      if (i >= order.length){
        setTimeout(function(){ if (playing === token){ playing = 0; document.getElementById("playbtn").setAttribute("aria-pressed", "false"); clearLit(); } }, 900);
        return;
      }
      var id = order[i++];
      var elx = nodeEls.get(id);
      if (elx){ elx.classList.remove("lit"); void elx.getBBox; elx.classList.add("lit"); }
      edgeEls.forEach(function(o){ if (o.e.to === id && seen.has(o.e.from)) o.el.classList.add("lit"); });
      setTimeout(tick, 380);
    })();
  }
  function clearLit(){
    nodeEls.forEach(function(elx){ elx.classList.remove("lit"); });
    edgeEls.forEach(function(o){ o.el.classList.remove("lit"); });
  }

  function elp(tag, cls, text, parent){
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    if (text != null) d.textContent = text;
    (parent || panelEl).appendChild(d); return d;
  }
  function kindColor(k){ return "var(--node-" + (k === "external" ? "ext" : k) + "-a)"; }
  function edgeRows(title, list, pick, parent){
    var sec = elp("div", "sec", null, parent);
    elp("h3", null, title + " (" + list.length + ")", sec);
    if (!list.length){ elp("div", "none", "—", sec); return; }
    var ul = elp("ul", "rows", null, sec);
    list.forEach(function(e){
      var id = pick(e), t = byId.get(id), li = elp("li", null, null, ul);
      var dot = elp("span", "kd", null, li); dot.style.background = kindColor(t.kindN);
      elp("span", "nm", t.label || id, li);
      elp("span", "ek", e.back ? "back" : (e.kind || "call"), li);
      li.addEventListener("click", function(){ select(id); centerOn(t); });
    });
  }
  function renderPanel(){
    panelEl.innerHTML = "";
    if (!selId || !visible.has(selId)){
      var hd = elp("div", "phead");
      elp("h1", null, meta.feature || "Code flow", hd);
      var tr = elp("div", "tagrow", null, hd);
      if (meta.generated) elp("span", "tag", "generated " + meta.generated, tr);
      if (meta.slug) elp("span", "tag", meta.slug, tr);
      var bd = elp("div", "pbody");
      if (meta.description){
        var s0 = elp("div", "sec", null, bd);
        elp("p", null, meta.description, s0);
      }
      var s1 = elp("div", "sec", null, bd);
      elp("h3", null, "Shape", s1);
      var st = elp("div", "stats", null, s1);
      [[nodes.length, "nodes"], [edges.length, "edges"], [modules.length, "modules"]].forEach(function(p){
        var c = elp("div", "stat", null, st); elp("b", null, String(p[0]), c); elp("span", null, p[1], c);
      });
      var s2 = elp("div", "sec", null, bd);
      elp("h3", null, "Node kinds", s2);
      var lg = elp("div", "legend", null, s2);
      [["entry","entry point"],["step","internal step"],["external","third party"],["io","i/o boundary"],["component","UI component"]].forEach(function(k){
        var row = elp("div", null, null, lg);
        var sw = elp("span", "sw", null, row);
        sw.style.background = "var(--node-" + (k[0] === "external" ? "ext" : k[0]) + ")";
        sw.style.boxShadow = "inset 0 0 0 1px var(--node-" + (k[0] === "external" ? "ext" : k[0]) + "-s)";
        elp("span", null, k[0] + " · " + k[1], row);
      });
      var s3 = elp("div", "sec", null, bd);
      elp("h3", null, "Edge kinds", s3);
      var le = elp("div", "legend", null, s3);
      [["call","solid"],["async","dashed"],["conditional","labelled"],["render","dotted"],["back / cycle","dashed, routed around"]].forEach(function(k){
        var row = elp("div", null, null, le);
        var sv = document.createElementNS(SVGNS, "svg"); sv.setAttribute("viewBox", "0 0 22 8");
        var ln = document.createElementNS(SVGNS, "line");
        ln.setAttribute("x1", 0); ln.setAttribute("y1", 4); ln.setAttribute("x2", 22); ln.setAttribute("y2", 4);
        ln.setAttribute("stroke", "var(--edge)"); ln.setAttribute("stroke-width", 1.6);
        if (k[1].indexOf("dashed") >= 0) ln.setAttribute("stroke-dasharray", "4 3");
        sv.appendChild(ln); row.appendChild(sv);
        elp("span", null, k[0] + " · " + k[1], row);
      });
      var s4 = elp("div", "sec", null, bd);
      elp("h3", null, "Keys", s4);
      var kk = elp("div", "keys", null, s4);
      [["/", "focus search"], ["← → ↑ ↓", "move between nodes"], ["Enter", "select · centre"],
       ["Space", "collapse / expand"], ["D", "direction"], ["G", "module lanes"], ["P", "play"],
       ["F", "fit"], ["Esc", "clear"]].forEach(function(p){
        var k = document.createElement("kbd"); k.textContent = p[0]; kk.appendChild(k);
        elp("span", null, p[1], kk);
      });
      return;
    }
    var n = byId.get(selId);
    var hd2 = elp("div", "phead");
    elp("h1", null, n.label || n.id, hd2);
    var tr2 = elp("div", "tagrow", null, hd2);
    var tg = elp("span", "tag", null, tr2);
    var dt = elp("span", "dot", null, tg); dt.style.background = kindColor(n.kindN);
    elp("span", null, n.kindN, tg);
    elp("span", "tag", trunc(n.mod, 30), tr2);
    var bd2 = elp("div", "pbody");
    if (n.description){ var sd = elp("div", "sec", null, bd2); elp("p", null, n.description, sd); }
    var sl = elp("div", "sec", null, bd2);
    var loc = String(n.file || "?") + (n.line != null ? ":" + n.line : "");
    elp("div", "floc", loc, sl);
    var acts = elp("div", "acts", null, sl);
    var cp = elp("button", null, "Copy file:line", acts);
    cp.addEventListener("click", function(){
      var done = function(){ cp.textContent = "Copied"; setTimeout(function(){ cp.textContent = "Copy file:line"; }, 1200); };
      if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(loc).then(done, function(){ fbCopy(loc); done(); }); }
      else { fbCopy(loc); done(); }
    });
    if (n.file && meta.root){
      var aEl = elp("a", null, "Open in VS Code", acts);
      aEl.href = "vscode://file/" + String(meta.root).replace(/\/+$/, "") + "/" + String(n.file).replace(/^\/+/, "") + (n.line != null ? ":" + n.line : "");
    }
    var kids = descendants(n.id);
    if (kids.size){
      var cb = elp("button", null, collapsed.has(n.id) ? "Expand subtree (" + kids.size + ")" : "Collapse subtree (" + kids.size + ")", acts);
      cb.addEventListener("click", function(){
        if (collapsed.has(n.id)) collapsed.delete(n.id); else collapsed.add(n.id);
        render(); applyState(); renderPanel();
      });
    }
    if (n.snippet){
      var ss = elp("div", "sec", null, bd2);
      elp("h3", null, "Source", ss);
      elp("pre", "mono", n.snippet, ss);
    }
    edgeRows("Called by", edges.filter(function(e){ return e.to === selId; }), function(e){ return e.from; }, bd2);
    edgeRows("Calls", edges.filter(function(e){ return e.from === selId; }), function(e){ return e.to; }, bd2);
  }
  function fbCopy(t){
    var ta = document.createElement("textarea");
    ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }

  chipHostEl.innerHTML = "";
  KINDS.forEach(function(k){
    var kcount = nodes.filter(function(n){ return n.kindN === k; }).length;
    if (!kcount) return;
    var b = document.createElement("button");
    b.className = "chip"; b.setAttribute("aria-pressed", "true"); b.title = "Show/hide " + k + " nodes";
    var d = document.createElement("span"); d.className = "dot"; d.style.background = kindColor(k);
    b.appendChild(d);
    b.appendChild(document.createTextNode(k + " " + kcount));
    b.addEventListener("click", function(){
      if (kindOn.has(k)) kindOn.delete(k); else kindOn.add(k);
      b.setAttribute("aria-pressed", kindOn.has(k) ? "true" : "false");
      render(); applyState(); renderPanel();
    });
    chipHostEl.appendChild(b);
  });

  function matches(nd, qy){
    return (nd.label || "").toLowerCase().indexOf(qy) >= 0 ||
           (nd.file || "").toLowerCase().indexOf(qy) >= 0 ||
           (nd.description || "").toLowerCase().indexOf(qy) >= 0 ||
           nd.id.toLowerCase().indexOf(qy) >= 0;
  }
  searchEl.value = "";
  scountEl.textContent = "";
  searchEl.oninput = function(){
    var qy = searchEl.value.trim().toLowerCase();
    matchSet = qy ? new Set(nodes.filter(function(nd){ return matches(nd, qy); }).map(function(nd){ return nd.id; })) : null;
    scountEl.textContent = matchSet ? matchSet.size : "";
    applyState();
  };
  searchEl.onkeydown = function(e){
    if (e.key === "Escape"){ searchEl.value = ""; matchSet = null; scountEl.textContent = ""; applyState(); searchEl.blur(); return; }
    if (e.key !== "Enter" || !matchSet) return;
    var list = nodes.filter(function(nd){ return matchSet.has(nd.id) && visible.has(nd.id); });
    if (!list.length) return;
    var idx = list.findIndex(function(nd){ return nd.id === selId; });
    var nx = list[(idx + 1) % list.length];
    select(nx.id); centerOn(nx);
  };

  function setDir(d){
    if (dir === d) return;
    dir = d;
    document.getElementById("dirLR").setAttribute("aria-pressed", d === "LR" ? "true" : "false");
    document.getElementById("dirTD").setAttribute("aria-pressed", d === "TD" ? "true" : "false");
    render(); applyState(); fit();
  }
  document.getElementById("dirLR").onclick = function(){ setDir("LR"); };
  document.getElementById("dirTD").onclick = function(){ setDir("TD"); };
  var groupBtn = document.getElementById("groupbtn");
  groupBtn.setAttribute("aria-pressed", grouped ? "true" : "false");
  function toggleGroup(){
    grouped = !grouped;
    groupBtn.setAttribute("aria-pressed", grouped ? "true" : "false");
    render(); applyState(); fit();
  }
  groupBtn.onclick = toggleGroup;
  document.getElementById("playbtn").onclick = play;
  document.getElementById("fitbtn").onclick = fit;
  document.getElementById("zin").onclick = function(){ zoomAt(0.8); };
  document.getElementById("zout").onclick = function(){ zoomAt(1.25); };

  function neighbourStep(key){
    if (!selId){
      var r0 = roots.find(function(r){ return visible.has(r.id); });
      if (r0){ select(r0.id); centerOn(r0); }
      return;
    }
    var cur = byId.get(selId);
    var fwd = dir === "LR" ? "ArrowRight" : "ArrowDown";
    var bwd = dir === "LR" ? "ArrowLeft" : "ArrowUp";
    var cand;
    if (key === fwd) cand = outF.get(selId).map(function(e){ return byId.get(e.to); });
    else if (key === bwd) cand = inF.get(selId).map(function(e){ return byId.get(e.from); });
    else {
      var sign = (key === "ArrowDown" || key === "ArrowRight") ? 1 : -1;
      cand = nodes.filter(function(n){
        if (!visible.has(n.id) || n.id === selId || n.rank !== cur.rank) return false;
        var d = dir === "LR" ? n.y - cur.y : n.x - cur.x;
        return sign > 0 ? d > 1 : d < -1;
      }).sort(function(a, b){
        var da = dir === "LR" ? Math.abs(a.y - cur.y) : Math.abs(a.x - cur.x);
        var db = dir === "LR" ? Math.abs(b.y - cur.y) : Math.abs(b.x - cur.x);
        return da - db;
      });
      cand = cand.slice(0, 1);
    }
    cand = (cand || []).filter(function(n){ return n && visible.has(n.id); });
    if (cand.length){ select(cand[0].id); centerOn(cand[0]); }
  }
  function toggleCollapseSelected(){
    if (!selId) return;
    if (collapsed.has(selId)) collapsed.delete(selId); else collapsed.add(selId);
    render(); applyState(); renderPanel();
  }

  /* ---- cross-flow navigation: every flow in the bundle can switch to any other ---- */
  var flowList = Array.isArray(INDEX.flows) ? INDEX.flows.filter(function(f){ return f && f.slug; }) : [];
  flowselEl.innerHTML = "";
  if (flowList.length > 1){
    flowList.forEach(function(f){
      var o = document.createElement("option");
      o.value = f.slug;
      o.textContent = (f.title || f.slug) + (f.nodes ? "  ·  " + f.nodes : "");
      if (f.slug === slug){ o.selected = true; o.textContent = "▸ " + o.textContent; }
      flowselEl.appendChild(o);
    });
    flowselEl.hidden = false;
    flowselEl.onchange = function(){
      if (flowselEl.value && flowselEl.value !== slug) location.hash = "#/flow/" + encodeURIComponent(flowselEl.value);
    };
  } else {
    flowselEl.hidden = true;
    flowselEl.onchange = null;
  }

  if (meta.feature){
    document.getElementById("ftitle").textContent = meta.feature;
    document.title = meta.feature + " · code flow";
  } else {
    document.getElementById("ftitle").textContent = "Code Flow";
  }
  document.getElementById("fmeta").textContent =
    nodes.length + " nodes · " + edges.length + " edges" + (modules.length > 1 ? " · " + modules.length + " modules" : "");

  render();
  renderPanel();
  applyState();
  initialView();

  flowCtl = {
    neighbourStep: neighbourStep,
    toggleCollapseSelected: toggleCollapseSelected,
    fit: fit,
    toggleGroup: toggleGroup,
    setDir: function(){ setDir(dir === "LR" ? "TD" : "LR"); },
    play: play,
    clearSelection: function(){ select(null); },
    onResize: function(){ applyVB(); }
  };
}

/* ---- chrome wired once: static controls that are shared by every flow ---- */
wireTheme(document.getElementById("themebtn-flow"));
document.addEventListener("keydown", function(e){
  if (viewEls.flow.hidden || !flowCtl) return;
  var typing = document.activeElement === searchEl;
  if (e.key === "/" && !typing){ e.preventDefault(); searchEl.focus(); searchEl.select(); return; }
  if (typing) return;
  if (e.key === "Escape"){ flowCtl.clearSelection(); searchEl.value = ""; scountEl.textContent = ""; return; }
  if (e.key.indexOf("Arrow") === 0){ e.preventDefault(); flowCtl.neighbourStep(e.key); return; }
  if (e.key === " "){ e.preventDefault(); flowCtl.toggleCollapseSelected(); return; }
  var k = e.key.toLowerCase();
  if (k === "f") flowCtl.fit();
  else if (k === "g") flowCtl.toggleGroup();
  else if (k === "d") flowCtl.setDir();
  else if (k === "p") flowCtl.play();
});
window.addEventListener("resize", function(){
  if (!viewEls.flow.hidden && flowCtl) flowCtl.onResize();
});

/* ============ router ============
   "" or "#/"            -> index (the landing view)
   "#/flow/<slug>"        -> that flow's graph
   "#/report"              -> the quality report, when one was generated */
function route(){
  var h = location.hash;
  var m = /^#\/flow\/(.+)$/.exec(h);
  if (m){
    showView("flow");
    mountFlow(decodeURIComponent(m[1]));
    return;
  }
  if (h === "#/report"){
    showView("report");
    renderReport();
    return;
  }
  showView("index");
  renderIndex();
}
window.addEventListener("hashchange", route);
route();
})();
</script>
