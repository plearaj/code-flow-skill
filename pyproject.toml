[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "htst-code-flow-skill"
version = "1.2.0"
description = "Installable Code Flow skill and command templates for Claude Code, GitHub Copilot, OpenAI Codex, Antigravity and Gemini CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Hightower Software Technologies" }]
keywords = ["code-flow", "skill", "claude", "gemini", "copilot", "documentation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: Apache Software License",
  "Environment :: Console"
]

[project.scripts]
code-flow-skill = "code_flow_skill.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/fixtures/ holds sample repositories for the tracers to read, not tests of
# this project. One of them is a `test_*.py` importing a package that exists only
# inside that fixture — the Python tracer has to prove it marks test-role
# functions — so collection has to stay out rather than try to import it.
norecursedirs = ["fixtures"]

[tool.hatch.build.targets.wheel]
packages = ["src/code_flow_skill"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "code_flow_skill/templates"

[tool.hatch.build.targets.sdist]
include = ["src", "templates", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE", "pyproject.toml"]
